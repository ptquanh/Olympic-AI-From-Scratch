schema_version: 1
release: 0.2.0-beta
scope: modules/00-05
status_values:
  [outlined, drafted, technically_reviewed, learner_tested, revised, published]
competition_profiles:
  general:
    label: Olympic AI chung
    note: Kiến thức dùng chung; không gán luật, thời lượng hoặc thư viện của một kỳ thi cụ thể.
  ptit_2026:
    label: Olympic AI PTIT 2026
    rules_source: https://ai.ptit.edu.vn/olympic-ai-ptit-2026-dong-cong-dang-ky-cac-doi-buoc-vao-giai-doan-chuan-bi-cho-vong-so-loai/
    update_source: https://ai.ptit.edu.vn/thong-bao-dieu-chinh-lich-thi-olympic-ai-ptit-2026/
    llm_source: https://ai.ptit.edu.vn/olympic-ai-ptit-2026-dong-cong-dang-ky-cac-doi-buoc-vao-giai-doan-chuan-bi-cho-vong-so-loai/
    verified: 2026-08-31
  olpai:
    label: Olympic AI Sinh viên Việt Nam
    note: Chưa gắn một bộ luật cụ thể; phải kiểm tra thông báo đúng mùa thi trước khi áp dụng.
  voai_2026:
    label: Vietnam Olympiad in Artificial Intelligence 2026
    source: https://www.olp.vn/olympic-ai-cho-h%E1%BB%8Dc-sinh/th%C3%B4ng-b%C3%A1o-voai
    verified: 2026-08-31
    note: Vòng sơ loại 180 phút và chung kết 6 giờ là quy định VOAI 2026, không phải mặc định chung.
  ioai_2026:
    label: International Olympiad in Artificial Intelligence 2026
    rules_source: https://ioai-official.org/2026-contest-rules/
    syllabus_source: https://ioai-official.org/2026-syllabus/
    verified: 2026-08-31
    note: Syllabus và contest rules được cập nhật theo mùa; không suy diễn luật PTIT/VOAI sang IOAI.

