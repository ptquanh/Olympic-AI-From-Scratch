name: curriculum-quality

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.3 nbformat==5.10.4
      - run: python tools/audit_curriculum.py --strict-git

  cpu-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine notebook scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          RUN=false
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            RUN=true
          else
            while IFS= read -r FILE; do
              case "$FILE" in
                requirements.txt|requirements-dev.txt|requirements-contest.txt|requirements-optional.txt|constraints-py310.txt|environment.yml|environment-gpu.yml|tools/run_notebooks.py)
                  RUN=true ;;
                modules/*practice*.ipynb)
                  ;;
                modules/*.ipynb)
                  RUN=true ;;
                modules/*)
                  if [[ "$FILE" != *.md ]]; then RUN=true; fi ;;
              esac
            done < <(git diff --name-only --diff-filter=ACMRD "$BASE_SHA" --)
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.10"
          cache: pip
      - if: steps.scope.outputs.run == 'true'
        run: python -m pip install -r requirements-dev.txt -c constraints-py310.txt
      - name: Run affected notebooks
        if: steps.scope.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "pull_request" ]]; then
            python tools/run_notebooks.py --fast --profile cpu --offline --timeout 180 --repeats 2 --changed-since "$BASE_SHA"
          else
            python tools/run_notebooks.py --fast --profile cpu --offline --timeout 180 --repeats 2
          fi
      - name: Verify notebook report
        if: steps.scope.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "pull_request" ]]; then
            python tools/verify_notebook_report.py _dev/notebook_report.json --profile cpu --min-repeats 2 --allow-partial
          else
            python tools/verify_notebook_report.py _dev/notebook_report.json --profile cpu --min-repeats 2
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: notebook-report
          path: _dev/notebook_report.json
